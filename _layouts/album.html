---
layout: default
copyright: true
---
<div class="site-section">
  <div class="container-fluid">

    <div class="row justify-content-center">

      <div class="col-md-7">
        <div class="row mb-5">
          <div class="col-12 ">
            <h1 class="site-section-heading text-center">{{ page.title }}</h1>
          </div>
        </div>
      </div>

    </div>

    {{ content }}

    <div class="grid">
      {% for image in page.images %}
        {% capture src %}/images/albums/{{ page.slug | downcase }}/{{ image }}{% endcapture %}
        <div class="px-1 py-1">
          <a href="{{ src }}" data-fancybox="gallery">
            <img src="{{ src | replace: '.', '_small.' }}" alt="{{ page.title }} photography by {{ site.author }} - San Francisco Bay Area" class="img-fluid"{% if forloop.index > 5 %} loading="lazy" decoding="async"{% elsif forloop.first %} fetchpriority="high"{% endif %}>
          </a>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
